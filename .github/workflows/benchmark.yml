name: benchmark

# Manual only: run the phantom labelling benchmarks (cartoon and realistic robustness suites) and check them against
# benchmarks/golden.json. The public datasets (SPIDER, Sudirman, qx5rt) are not available in CI, so their sections are
# reported as skipped and not checked. Full local run: docs/benchmarks.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phantom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Phantom benchmarks and regression check
        run: >-
          python tools/benchmark.py
          --suites phantom
          --out "$RUNNER_TEMP/spinescope-benchmark"
          --cache "$RUNNER_TEMP/spinescope-benchmark-cache"
          --check benchmarks/golden.json
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-phantom
          path: ${{ runner.temp }}/spinescope-benchmark
          if-no-files-found: ignore
